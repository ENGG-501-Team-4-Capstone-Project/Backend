services:
  api:
    build: .
    restart: unless-stopped
    environment:
      PORT: 3000
      OPEN_ROUTER_API_KEY: ${OPEN_ROUTER_API_KEY:?OPEN_ROUTER_API_KEY is required}
    ports:
      - '3000:3000'
    develop:
      watch:
        - action: rebuild
          path: ./src
        - action: rebuild
          path: ./prisma
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./pnpm-lock.yaml
